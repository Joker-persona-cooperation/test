name: CI and Deploy

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: taskpilot-web
          path: dist
          if-no-files-found: error

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: taskpilot-web
          path: dist

      - name: Validate deploy secrets
        env:
          WEB_DEPLOY_HOST: ${{ secrets.WEB_DEPLOY_HOST }}
          WEB_DEPLOY_PORT: ${{ secrets.WEB_DEPLOY_PORT }}
          WEB_DEPLOY_USER: ${{ secrets.WEB_DEPLOY_USER }}
          WEB_DEPLOY_PATH: ${{ secrets.WEB_DEPLOY_PATH }}
          WEB_DEPLOY_SSH_KEY: ${{ secrets.WEB_DEPLOY_SSH_KEY }}
        run: |
          missing=0
          for secret_name in WEB_DEPLOY_HOST WEB_DEPLOY_PORT WEB_DEPLOY_USER WEB_DEPLOY_PATH WEB_DEPLOY_SSH_KEY; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::Missing required Actions secret: ${secret_name}"
              missing=1
            fi
          done
          test "$missing" -eq 0
        shell: bash

      - name: Prepare SSH
        env:
          WEB_DEPLOY_HOST: ${{ secrets.WEB_DEPLOY_HOST }}
          WEB_DEPLOY_PORT: ${{ secrets.WEB_DEPLOY_PORT }}
          WEB_DEPLOY_SSH_KEY: ${{ secrets.WEB_DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$WEB_DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$WEB_DEPLOY_PORT" "$WEB_DEPLOY_HOST" >> ~/.ssh/known_hosts
        shell: bash

      - name: Upload release
        env:
          WEB_DEPLOY_HOST: ${{ secrets.WEB_DEPLOY_HOST }}
          WEB_DEPLOY_PORT: ${{ secrets.WEB_DEPLOY_PORT }}
          WEB_DEPLOY_USER: ${{ secrets.WEB_DEPLOY_USER }}
        run: |
          tar -C dist -czf taskpilot-web.tar.gz .
          scp -i ~/.ssh/deploy_key -P "$WEB_DEPLOY_PORT" taskpilot-web.tar.gz \
            "$WEB_DEPLOY_USER@$WEB_DEPLOY_HOST:/tmp/taskpilot-web-${GITHUB_RUN_ID}.tar.gz"
        shell: bash

      - name: Activate release
        env:
          WEB_DEPLOY_HOST: ${{ secrets.WEB_DEPLOY_HOST }}
          WEB_DEPLOY_PORT: ${{ secrets.WEB_DEPLOY_PORT }}
          WEB_DEPLOY_USER: ${{ secrets.WEB_DEPLOY_USER }}
          WEB_DEPLOY_PATH: ${{ secrets.WEB_DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$WEB_DEPLOY_PORT" "$WEB_DEPLOY_USER@$WEB_DEPLOY_HOST" \
            "bash -s -- '$WEB_DEPLOY_PATH' '$GITHUB_RUN_ID'" <<'REMOTE'
          set -eu
          deploy_path=$1
          release_id=$2
          archive="/tmp/taskpilot-web-${release_id}.tar.gz"
          release_path="${deploy_path}/releases/${release_id}"
          mkdir -p "$release_path"
          tar -xzf "$archive" -C "$release_path"
          ln -sfn "$release_path" "${deploy_path}/current"
          rm -f "$archive"
          find "${deploy_path}/releases" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' \
            | sort -rn | awk 'NR > 5 { sub(/^[^ ]+ /, ""); print }' \
            | xargs -r rm -rf --
          REMOTE
        shell: bash
