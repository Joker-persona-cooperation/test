server {
    listen 80;
    server_name taskpilot.1kuansi.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name taskpilot.1kuansi.cn;

    ssl_certificate /etc/letsencrypt/live/taskpilot.1kuansi.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taskpilot.1kuansi.cn/privkey.pem;

    root /www/wwwroot/dev.taskpilot.1kuansi.cn/taskpilot-web/current;
    index index.html;

    # 注意：proxy_pass 末尾不能带 "/"，否则 Nginx 会把 location 匹配的
    # "/api/" 前缀剥离，导致转发给后端的路径变成 "/v1/..." 而 404。
    # 不带 "/" 时 Nginx 原样转发完整 URI（/api/v1/...），与后端路由一致。
    location /api/ {
        # 当前服务器复用开发 Compose，taskpilot-dev-app 映射到 8889。
        proxy_pass http://127.0.0.1:8889;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 兼容不带尾斜杠的 /api 请求（如 /api/v1/... 经某些客户端归一化后）。
    location = /api {
        return 301 https://$host/api/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
