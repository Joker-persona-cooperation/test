<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · TaskPilot</title>
<link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
<link rel="stylesheet" href="common.css">
</head>
<body>
<div id="app">
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-icon-lg">T</div>
        <h1>TaskPilot</h1>
        <p>把要求文档变成能执行的任务清单</p>
      </div>
      <el-form ref="formRef" :model="form" :rules="rules" label-position="top" size="large" @submit.prevent="handleSubmit">
        <el-form-item label="邮箱" prop="email">
          <el-input v-model="form.email" placeholder="请输入邮箱" :prefix-icon="Message" clearable></el-input>
        </el-form-item>
        <el-form-item label="密码" prop="password">
          <el-input v-model="form.password" type="password" placeholder="请输入密码（至少8位）" :prefix-icon="Lock" show-password></el-input>
        </el-form-item>
        <el-form-item>
          <el-button type="primary" native-type="submit" :loading="loading" style="width:100%;height:44px;font-size:15px;">登 录</el-button>
        </el-form-item>
      </el-form>
      <div style="text-align:center;font-size:14px;color:var(--color-text-soft);">
        还没有账号？<a href="register.html">立即注册</a>
      </div>
      <div style="margin-top:24px;text-align:center;">
        <a href="index.html" style="font-size:13px;color:var(--color-text-soft);">&larr; 返回预览总览</a>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://unpkg.com/element-plus"></script>
<script src="https://unpkg.com/@element-plus/icons-vue"></script>
<script>
const { createApp, ref, reactive } = Vue;
const { ElMessage } = ElementPlus;

const App = {
  setup() {
    const formRef = ref();
    const loading = ref(false);
    const form = reactive({ email: 'zmk@example.com', password: '' });
    const rules = {
      email: [
        { required: true, message: '请输入邮箱', trigger: 'blur' },
        { type: 'email', message: '邮箱格式不正确', trigger: 'blur' }
      ],
      password: [
        { required: true, message: '请输入密码', trigger: 'blur' },
        { min: 8, message: '密码至少8位', trigger: 'blur' }
      ]
    };
    const handleSubmit = () => {
      formRef.value.validate((valid) => {
        if (!valid) return;
        loading.value = true;
        setTimeout(() => {
          loading.value = false;
          ElMessage.success('登录成功');
          window.location.href = 'dashboard.html';
        }, 800);
      });
    };
    return { formRef, form, rules, loading, handleSubmit, Message: ElementPlusIconsVue.Message, Lock: ElementPlusIconsVue.Lock };
  }
};
const app = createApp(App);
app.use(ElementPlus);
for (const [key, comp] of Object.entries(ElementPlusIconsVue)) app.component(key, comp);
app.mount('#app');
</script>
</body>
</html>
